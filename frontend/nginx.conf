##############################################################################
# SYNC ANTIC — Configuration Nginx
# Frontend (React/Vite) sur port 80, Backend (Spring Boot) sur port 8080
#
# Emplacement recommandé : /etc/nginx/sites-available/sync-antic
# Activer avec : sudo ln -s /etc/nginx/sites-available/sync-antic /etc/nginx/sites-enabled/
# Tester       : sudo nginx -t
# Recharger    : sudo systemctl reload nginx
##############################################################################

server {
    listen 80;
    listen [::]:80;

    # ── Remplacez par votre domaine ou IP du serveur ─────────────────────────
    server_name localhost;
    # server_name antic.cm www.antic.cm;   ← exemple avec domaine réel

    # ── Frontend (build Vite : npm run build → dossier dist/) ────────────────
    root /var/www/sync-antic/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Cache long pour les assets Vite (ils ont un hash dans le nom)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API — Proxy vers Spring Boot (port 8080) ──────────────────────────────
    # Toutes ces routes sont interceptées AVANT le fallback React
    location ~ ^/(auth|dossiers|users|antennes|categories|etapes|documents|files)(/.*)?$ {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout généreux pour les uploads de fichiers (10 MB)
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        # Taille max upload (doit correspondre à spring.servlet.multipart.max-request-size)
        client_max_body_size 15M;
    }

    # ── React SPA — toutes les autres routes renvoient index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

