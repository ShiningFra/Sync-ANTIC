spring.application.name=Antic-CIRT
server.port=8080

# Base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cirt_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=antic_cirt_secret_key_must_be_at_least_32_chars_long!
jwt.expiration=86400000

# Uploads
file.upload-dir=uploads
upload.path=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.org.springframework=INFO
logging.level.com.sync=DEBUG

# Compte super_admin initial (à changer avant la prod !)
# Le super_admin crée ensuite le directeur CIRT via l'interface.
init.superadmin.email=superadmin@antic.cm
init.superadmin.password=SuperAdmin@1234!
init.superadmin.name=Super Administrateur

# CORS
cors.allowed-origins=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
spring.jackson.serialization.fail-on-empty-beans=false
