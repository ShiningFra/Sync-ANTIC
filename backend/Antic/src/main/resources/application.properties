spring.application.name=Antic
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/cirt_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=antic_secret_key_change_me_in_prod_min32chars
jwt.expiration=86400000

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework=INFO
logging.level.com.antic=DEBUG

upload.path=uploads

# ── Compte super_admin initial (créé au premier démarrage si absent) ──────────
# Changez ces valeurs AVANT le premier démarrage en production !
init.admin.email=admin@antic.cm
init.admin.password=Admin@1234!
init.admin.name=Directeur CIRT
