spring.application.name=Antic-CIRT
server.port=8080

# Base de donn\u00c3\u00a9es MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cirt_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=antic_cirt_secret_key_must_be_at_least_32_chars_long!
jwt.expiration=86400000

# Uploads de fichiers
file.upload-dir=uploads
upload.path=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.org.springframework=INFO
logging.level.com.sync=DEBUG

# Compte super_admin initial (\u00c3\u00a0 modifier avant la prod !)
init.admin.email=admin@antic.cm
init.admin.password=Admin@1234!
init.admin.name=Directeur CIRT

# CORS \u00e2\u0080\u0094 ajoutez votre domaine de production ici
cors.allowed-origins=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
spring.jackson.serialization.fail-on-empty-beans=false